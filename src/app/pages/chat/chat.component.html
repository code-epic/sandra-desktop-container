<!-- Floating Action Button -->
<div class="chat-fab-container">
    <button class="chat-fab" (click)="toggleChat()">
        <div class="fab-content">
            <!-- Logo when closed, Chevron when open -->
             <img src="assets/sandra.png" alt="Sandra" class="sandra-icon-img" *ngIf="!isOpen">
             <i class="fas fa-chevron-down" *ngIf="isOpen" style="font-size: 1.2em;"></i>
        </div>
        <div class="status-indicator" [class.online]="wsStatus === 'Conectado'"></div>
        <div class="unread-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</div>
    </button>
</div>

<!-- Chat Window -->
<div class="chat-window-container" [class.open]="isOpen">
    
    <!-- Header -->
    <div class="chat-header">
        <div class="header-info">
            <div class="avatar-circle">
                <img src="assets/sandra.png" alt="Sandra" class="avatar-img">
                <div class="status-dot" [class.online]="wsStatus === 'Conectado'"></div>
            </div>
            <div class="header-text">
                <h3>Sandra IA</h3>
                <span class="status-text">{{ wsStatus }}</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header-action" (click)="openHistoryModal()" title="Historial">
                <i class="fas fa-history"></i>
            </button>
            <button class="btn-close-chat" (click)="toggleChat()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Body / Messages -->
    <div class="chat-body" #scrollContainer>
        
        <!-- Loading Initial State -->
        <div class="loading-state" *ngIf="isLoading">
            <div class="spinner-circle"></div>
            <p>Conectando con el Núcleo...</p>
        </div>

        <!-- Disconnected Overlay -->
        <div class="disconnected-overlay" *ngIf="wsStatus === 'Desconectado' && !isLoading">
            <div class="overlay-content">
                <i class="fas fa-wifi-slash"></i>
                <p>Sin conexión al servidor</p>
                <small>Las funciones remotas no están disponibles.</small>
            </div>
        </div>

        <!-- Messages List -->
        <div class="messages-list" *ngIf="!isLoading">
            <div class="message-row" *ngFor="let msg of messages" 
                 [class.user-row]="msg.sender === 'user'" 
                 [class.ai-row]="msg.sender === 'sandra'">
                
                <div class="message-content-wrapper">
                    <div class="sender-info" *ngIf="msg.sender === 'sandra' && msg.from">
                        <span class="sender-name">{{ msg.from }}</span>
                    </div>
                    
                    <div class="bubble-container">
                        <div class="message-bubble" [class.user-bubble]="msg.sender === 'user'" [class.ai-bubble]="msg.sender === 'sandra'">
                            <span class="bubble-text">{{ msg.text }}<span class="typing-cursor" *ngIf="msg.isTyping"></span></span>
                            
                            <div class="message-meta-v2">
                                <span class="message-time">{{ msg.timestamp | date:'HH:mm' }}</span>
                                <span class="message-status" *ngIf="msg.sender === 'user'">
                                    <i class="fas fa-clock shadow-pulse" *ngIf="msg.status === 'pending'" title="Pendiente"></i>
                                    <i class="fas fa-check" *ngIf="msg.status === 'sent'"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Typing Indicator (Thinking) -->
        <div class="message-row" *ngIf="isTyping">
            <div class="message-bubble ai-bubble typing-bubble">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div> <!-- End chat-body -->

    <!-- Footer / Input -->
    <div class="chat-footer">
        <div class="input-wrapper">
            <textarea 
                   [(ngModel)]="newMessage" 
                   (keydown)="handleKeyDown($event)"
                   (input)="onInput($event)"
                   placeholder="Escribe un mensaje..." 
                   [disabled]="wsStatus === 'Desconectado' || isLoading"
                   rows="1"></textarea>
            <button class="btn-send" (click)="sendMessage()" [disabled]="!newMessage.trim() || wsStatus === 'Desconectado'">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- History Modal Overlay -->
    <div class="history-modal-overlay" *ngIf="isHistoryOpen" (click)="closeHistoryModal()">
        <div class="history-modal" (click)="$event.stopPropagation()">
            <div class="history-header">
                <h3>Historial de Sandra</h3>
                <button class="btn-close-mini" (click)="closeHistoryModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="history-body">
                <div class="history-empty" *ngIf="historyGroups.length === 0">
                    <i class="fas fa-calendar-alt"></i>
                    <p>No hay conversaciones archivadas aún.</p>
                </div>
                <!-- Grupos de historial irán aquí -->
            </div>
        </div>
    </div>

</div> <!-- End chat-window-container -->
