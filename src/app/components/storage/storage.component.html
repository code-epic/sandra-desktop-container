<!-- DB Info Modal (View Mode) -->
<app-modal
  *ngIf="!showDropConfirmModal && !showExportConfirmModal"
  title="Estructura de Datos"
  width="500px"
  [showConfirm]="false"
  [showIcon]="false"
  [showCancel]="false">

  <div class="db-modal-body">

    <!-- Header de sección -->
    <div class="db-section-header">
      <span class="db-section-icon">
        <i class="fas fa-database"></i>
      </span>
      <div>
        <span class="db-section-title">sdc_secure_core.db</span>
        <span class="db-section-sub">{{ dbStats?.tables?.length || 0 }} tablas registradas</span>
      </div>
    </div>

    <div class="db-divider"></div>

    <!-- Árbol de tablas -->
    <div class="db-tree-container">
      <ul class="db-table-list">
        <li *ngFor="let table of dbStats?.tables">

          <div class="db-tree-node" (click)="toggleTable(table)"
               [class.active]="expandedTable === table">
            <span class="db-node-icon">
              <i class="fas" [class.fa-caret-right]="expandedTable !== table"
                             [class.fa-caret-down]="expandedTable === table"></i>
            </span>
            <span class="db-node-table-icon">
              <i class="fas fa-table"></i>
            </span>
            <span class="db-node-name">{{ table }}</span>
          </div>

          <!-- Columnas expandidas -->
          <div class="db-tree-children" *ngIf="expandedTable === table">
            <div class="db-col-loading" *ngIf="tableColumns.length === 0">
              <i class="fas fa-circle-notch fa-spin"></i> Cargando esquema...
            </div>
            <div class="db-col-row" *ngFor="let col of tableColumns">
              <span class="db-col-name">
                <i class="fas fa-columns"></i> {{ col.name }}
              </span>
              <span class="db-col-type">{{ col.type_ }}</span>
            </div>
          </div>

        </li>
      </ul>

      <!-- Estado vacío -->
      <div class="db-empty-state" *ngIf="!dbStats?.tables?.length">
        <span class="db-empty-icon"><i class="fas fa-database"></i></span>
        <p>No hay tablas registradas</p>
      </div>
    </div>

    <div class="db-divider"></div>

    <!-- Acciones -->
    <div class="db-actions">
      <button class="db-btn-danger" (click)="requestDropDB()">
        <i class="fas fa-trash-alt"></i> Eliminar BD
      </button>
      <button class="db-btn-primary" (click)="requestExportDB()">
        <i class="fas fa-download"></i> Exportar BD
      </button>
      <button class="db-btn-ghost" (click)="closeModal()">Cerrar</button>
    </div>

  </div>
</app-modal>

<!-- Drop Confirmation Modal -->
<app-modal
  *ngIf="showDropConfirmModal"
  title="Eliminar Base de Datos"
  type="error"
  [isLoading]="isDroppingDB"
  loadingText="Reiniciando Base de Datos..."
  message="¿Estás seguro de que deseas eliminar toda la base de datos? Esta acción no se puede deshacer."
  confirmText="Eliminar"
  confirmStyle="danger"
  (confirm)="dropDB()"
  (cancel)="cancelDropDB()">
</app-modal>

<!-- Export Confirmation Modal -->
<app-modal
  *ngIf="showExportConfirmModal"
  title="Exportar Base de Datos"
  [type]="exportStep === 'loading' ? 'loading' : (exportStep === 'ready' ? 'success' : 'info')"
  [isLoading]="exportStep === 'loading'"
  loadingText="Generando archivo de respaldo..."
  [showConfirm]="false"
  [showCancel]="false"
  (cancel)="cancelExportDB()">

  <div *ngIf="exportStep === 'confirm'">
    <p class="modal-message" style="text-align: center;">¿Deseas iniciar la generación del respaldo de la base de datos?</p>
  </div>

  <div *ngIf="exportStep === 'ready'">
    <p class="modal-message" style="text-align: center;">¡Respaldo generado correctamente!<br>Listo para descargar.</p>
  </div>

  <div footer *ngIf="exportStep === 'confirm'" class="modal-actions-group">
    <button class="btn-modal-cancel" (click)="cancelExportDB()">Cancelar</button>
    &nbsp;
    <button class="btn-modal-acept" (click)="generateBackup()">
      <i class="fas fa-play" style="margin-right: 6px; font-size: 0.9em;"></i> Iniciar
    </button>
  </div>

  <div footer *ngIf="exportStep === 'ready'" class="modal-actions-group">
    <button class="btn-modal-cancel" (click)="cancelExportDB()">Cerrar</button>
    &nbsp;
    <button class="btn-modal-acept" (click)="downloadBackup()">
      <i class="fas fa-download" style="margin-right: 8px;"></i> Descargar Archivo
    </button>
  </div>

</app-modal>
