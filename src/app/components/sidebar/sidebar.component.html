<aside class="sidebar" [class.closed]="!(isOpen$ | async)">
    <div class="sidebar-header">
        <div class="logo-circle">
            <i class="fas fa-microchip"></i>
        </div>
        <div class="brand-wrapper">
            <span class="brand-text">Sandra<small class="brand-lite">DC</small></span>
            <div class="datetime-info">{{ currentDateStr }} <span class="time-part">{{ currentTimeStr }}</span></div>
        </div>
    </div>

    <nav class="nav-menu">
        <!-- Items SIEMPRE accesibles -->
        <div class="nav-item" [class.active]="(activeTab$ | async) === 'dashboard'" (click)="switchToDashboard()">
            <i class="fas fa-th-large"></i> <span>Dashboard</span>
        </div>
        <div class="nav-item" [class.active]="(activeTab$ | async) === 'connections'"
            (click)="setActive('connections')">
            <i class="fas fa-network-wired"></i> <span>Conexiones</span>
        </div>
        <div class="nav-item" [class.active]="(activeTab$ | async) === 'apps'" (click)="setActive('apps')">
            <i class="fas fa-globe"></i> <span>Aplicaciones</span>
        </div>

        <!-- Items PROTEGIDOS — requieren JWT -->
        <div class="nav-item nav-item-protected"
            [class.active]="(activeTab$ | async) === 'security'"
            [class.nav-locked]="!hasJwt"
            (click)="setActive('security')"
            [attr.title]="!hasJwt ? 'Requiere autenticación JWT' : 'Seguridad'">
            <i class="fas fa-shield-alt"></i>
            <span>Seguridad</span>
            <i class="fas fa-lock nav-lock-icon" *ngIf="!hasJwt"></i>
        </div>
        <div class="nav-item nav-item-protected"
            [class.active]="(activeTab$ | async) === 'monitor'"
            [class.nav-locked]="!hasJwt"
            (click)="setActive('monitor')"
            [attr.title]="!hasJwt ? 'Requiere autenticación JWT' : 'Monitor'">
            <i class="fas fa-desktop"></i>
            <span>Monitor</span>
            <i class="fas fa-lock nav-lock-icon" *ngIf="!hasJwt"></i>
        </div>
        <div class="nav-item nav-item-protected"
            *ngIf="hasJwt"
            [class.active]="(activeTab$ | async) === 'proyectos'"
            [class.nav-locked]="!canAccessProjects"
            (click)="setActive('proyectos')"
            [attr.title]="!canAccessProjects ? 'No autorizado para proyectos' : 'Proyectos'">
            <i class="fas fa-project-diagram"></i>
            <span>Proyectos</span>
            <i class="fas fa-lock nav-lock-icon" *ngIf="!canAccessProjects"></i>
        </div>

        <div class="nav-spacer"></div>
        <div class="nav-divider"></div>

        <div class="nav-item nav-item-protected"
            [class.active]="(activeTab$ | async) === 'secure-viewer'"
            [class.nav-locked]="!hasJwt"
            (click)="setActive('secure-viewer')"
            [attr.title]="!hasJwt ? 'Requiere autenticación JWT' : 'Visor Seguro'">
            <i class="fas fa-file-shield"></i>
            <span>Visor Seguro</span>
            <i class="fas fa-lock nav-lock-icon" *ngIf="!hasJwt"></i>
        </div>

        <div class="nav-item help-item" [class.active]="(activeTab$ | async) === 'wiki-help'" (click)="openWikiHelp()">
            <i class="fas fa-book"></i> <span>Ayuda Wiki</span>
        </div>
        <div class="nav-item settings" (click)="toggleConfig()">
            <i class="fas fa-sliders-h"></i> <span>Configuración</span>
        </div>
        <div class="nav-item logout" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
        </div>
    </nav>
</aside>
