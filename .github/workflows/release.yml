name: Release
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm debsigs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm install

      - name: Import GPG key (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "SandraDC v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      - name: Generate and upload Source RPM (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 1. Obtener la version del tauri.conf.json
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_NAME="SandraDC"
          TAR_NAME="${PKG_NAME}-${VERSION}"

          # 2. Empaquetar el código fuente en un .tar.gz (excluyendo carpetas pesadas/innecesarias)
          echo "Creando empaquetado fuente ${TAR_NAME}.tar.gz ..."
          git archive --format=tar.gz --prefix="${TAR_NAME}/" -o "${TAR_NAME}.tar.gz" HEAD

          # 3. Preparar el entorno rpmbuild
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "${TAR_NAME}.tar.gz" ~/rpmbuild/SOURCES/

          # 4. Crear el archivo .spec dinámico
          cat <<EOF > ~/rpmbuild/SPECS/${PKG_NAME}.spec
          Name:           ${PKG_NAME}
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        Sandra Desktop Container

          License:        MIT
          URL:            https://github.com/${{ github.repository }}
          Source0:        %{name}-%{version}.tar.gz

          BuildRequires:  nodejs
          BuildRequires:  cargo
          BuildRequires:  rust
          BuildRequires:  webkit2gtk4.1-devel
          BuildRequires:  gtk3-devel
          BuildRequires:  librsvg2-devel
          BuildRequires:  openssl-devel
          BuildRequires:  glib2-devel
          BuildRequires:  libappindicator-gtk3-devel
          BuildRequires:  curl
          BuildRequires:  wget
          BuildRequires:  file
          BuildRequires:  gcc-c++

          %description
          Sandra Desktop Container Copr package.

          %prep
          %setup -q

          %build
          # Habilitar red obligatoria en COPR para dependencias NPM/Cargo
          npm install
          npm run build
          cd src-tauri
          cargo build --release

          %install
          rm -rf %{buildroot}

          # 1. Instalar Binario
          mkdir -p %{buildroot}%{_bindir}
          install -m 755 src-tauri/target/release/sandra-desktop-container %{buildroot}%{_bindir}/%{name}

          # 2. Instalar el Acceso Directo (.desktop)
          mkdir -p %{buildroot}%{_datadir}/applications
          echo "[Desktop Entry]" > %{buildroot}%{_datadir}/applications/%{name}.desktop
          echo "Name=Sandra Desktop Container" >> %{buildroot}%{_datadir}/applications/%{name}.desktop
          echo "Exec=%{name}" >> %{buildroot}%{_datadir}/applications/%{name}.desktop
          echo "Icon=%{name}" >> %{buildroot}%{_datadir}/applications/%{name}.desktop
          echo "Type=Application" >> %{buildroot}%{_datadir}/applications/%{name}.desktop
          echo "Terminal=false" >> %{buildroot}%{_datadir}/applications/%{name}.desktop
          echo "Categories=Utility;" >> %{buildroot}%{_datadir}/applications/%{name}.desktop

          # 3. Instalar el Icono
          mkdir -p %{buildroot}%{_datadir}/icons/hicolor/128x128/apps
          install -m 644 src-tauri/icons/128x128.png %{buildroot}%{_datadir}/icons/hicolor/128x128/apps/%{name}.png

          %files
          %{_bindir}/%{name}
          %{_datadir}/applications/%{name}.desktop
          %{_datadir}/icons/hicolor/128x128/apps/%{name}.png

          %changelog
          * $(date "+%a %b %d %Y") GitHub Actions <actions@github.com> - ${VERSION}-1
          - Automated src.rpm build for COPR
          EOF

          # 5. Configurar rpm para ignorar build missing (por ser un .src.rpm solo empaquetará las sources)
          echo "Generando .src.rpm..."
          rpmbuild -bs ~/rpmbuild/SPECS/${PKG_NAME}.spec

          # 6. Configurar y firmar los paquetes RPM y DEB generados
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "Configurando RPM macros para la firma..."
            GPG_KEY_ID=$(gpg --list-keys --with-colons | grep "^pub" | head -n1 | cut -d":" -f5)
            
            cat <<EOF > ~/.rpmmacros
          %_signature gpg
          %_gpg_path /home/runner/.gnupg
          %_gpg_name ${GPG_KEY_ID}
          %__gpg_sign_cmd %{__gpg} gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}
          EOF

            echo "Firmando .src.rpm con GPG..."
            find ~/rpmbuild/SRPMS/ -name "*.src.rpm" -exec rpm --addsign {} \;
            
            echo "Firmando paquetes RPM binarios generados por Tauri..."
            find src-tauri/target/release/bundle/rpm/ -name "*.rpm" -exec rpm --addsign {} \;
            
            echo "Firmando paquetes DEB binarios generados por Tauri..."
            for file in src-tauri/target/release/bundle/deb/*.deb; do
              if [ -f "$file" ]; then
                # debsigs usa la llave importada en el agente de GPG
                debsigs --sign=origin -k ${GPG_KEY_ID} "$file"
              fi
            done
          fi

          # 7. Mover el archivo generado al directorio de trabajo
          find ~/rpmbuild/SRPMS/ -name "*.src.rpm" -exec cp {} . \;

          # 8. Subir todo al Release usando el CLI de GitHub (esperamos a que el paso anterior termine el release)
          # Tauri action crea un release con el formato "app-vX.Y.Z". Construimos ese tag dinámicamente:
          TAG_NAME="app-v${VERSION}"

          # Esperar unos segundos para asegurar que tauri-action ya publicó el release (que fue lanzado por el tag actual)
          sleep 10

          echo "Subiendo assets firmados a release ${TAG_NAME} ..."
          gh release upload "${TAG_NAME}" *.src.rpm "${TAR_NAME}.tar.gz" src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/deb/*.deb --clobber
